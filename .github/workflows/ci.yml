name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  target-quality:
    name: Target API (TypeScript) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm audit --audit-level=high

  suite-quality:
    name: Test suite (Python) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest tests/scripts

  owasp-suite:
    name: OWASP API Top 10 suite (${{ matrix.mode }} target)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [hardened, vulnerable]
    env:
      SECURITY_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: npm ci
      - run: pip install -e .
      - name: Run suite
        id: suite
        run: pytest --junitxml=reports/junit.xml --html=reports/html/index.html --self-contained-html --alluredir=reports/allure-results
        continue-on-error: ${{ matrix.mode == 'vulnerable' }}
      - name: Assert every category is ${{ matrix.mode == 'vulnerable' && 'detected' || 'secure' }}
        run: python scripts/assert_detection.py --mode ${{ matrix.mode }} --junit reports/junit.xml
      - name: Assert the vulnerable run failed as a whole
        if: matrix.mode == 'vulnerable' && steps.suite.outcome != 'failure'
        run: |
          echo "The suite passed against the vulnerable target, so it detected nothing."
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-report-${{ matrix.mode }}
          path: |
            reports
            !reports/allure-results
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-${{ matrix.mode }}
          path: reports/allure-results
          retention-days: 14

  report:
    name: Allure reports
    needs: owasp-suite
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-results-hardened
          path: results/hardened
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: allure-results-vulnerable
          path: results/vulnerable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-report-hardened
          path: pytest-report
      - name: Write Allure environment
        env:
          RUN_TRIGGER: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for mode in hardened vulnerable; do
            cat > "results/$mode/environment.properties" <<EOF
          Run.Trigger=$RUN_TRIGGER
          Run.Id=$RUN_ID
          Commit=$COMMIT
          Branch=$BRANCH
          Target.SECURITY_MODE=$mode
          EOF
            cat "results/$mode/environment.properties"
          done
      - name: Generate Allure reports
        run: |
          npx --yes allure-commandline@2.46.1 generate results/hardened -o site/hardened --clean \
            --name "Hardened target - every test must pass"
          npx --yes allure-commandline@2.46.1 generate results/vulnerable -o site/vulnerable --clean \
            --name "Vulnerable target - failures are detected flaws"
      - name: Add the pytest-html report
        run: |
          mkdir -p site/pytest
          cp pytest-report/html/index.html site/pytest/index.html
      - name: Create index page
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>API Security Test Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 24px; }
              h1 { font-size: 1.5rem; margin-bottom: 8px; }
              p { color: #666; margin-bottom: 32px; }
              a { display: block; padding: 16px 20px; border: 1px solid #e2e8f0; border-radius: 8px; text-decoration: none; color: #0f172a; margin-bottom: 12px; }
              a:hover { background: #f8fafc; }
              a span { display: block; font-size: 0.85rem; color: #64748b; margin-top: 4px; }
            </style>
          </head>
          <body>
            <h1>API Security Test Suite - Reports</h1>
            <p>OWASP API Security Top 10 (2023) suite from the latest CI run on <strong>${BRANCH}</strong> (<code>${COMMIT:0:7}</code>).</p>
            <a href="hardened/">Hardened target (Allure)
              <span>Every test must pass. Grouped by OWASP category</span>
            </a>
            <a href="vulnerable/">Vulnerable target (Allure)
              <span>Failures are detected flaws. Every category must have at least one</span>
            </a>
            <a href="pytest/">Hardened target (pytest-html)
              <span>Single-page pytest-html report of the hardened run</span>
            </a>
          </body>
          </html>
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-site
          path: site
          retention-days: 14

  publish-report:
    name: Publish reports to Pages
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-site
          path: site
      - name: Refuse to publish an empty report
        run: |
          for mode in hardened vulnerable; do
            total=$(jq -r '.statistic.total // 0' "site/$mode/widgets/summary.json")
            echo "$mode report contains $total tests"
            if [ "$total" -lt 1 ]; then echo "::error::The $mode Allure report has no test results; keeping the previously published reports"; exit 1; fi
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Post report URL to summary
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Test reports"
            echo ""
            echo "| Report | Link |"
            echo "|--------|------|"
            echo "| Index | [$PAGES_URL]($PAGES_URL) |"
            echo "| Hardened target (Allure) | [${PAGES_URL}hardened/](${PAGES_URL}hardened/) |"
            echo "| Vulnerable target (Allure) | [${PAGES_URL}vulnerable/](${PAGES_URL}vulnerable/) |"
            echo "| Hardened target (pytest-html) | [${PAGES_URL}pytest/](${PAGES_URL}pytest/) |"
          } >> "$GITHUB_STEP_SUMMARY"
